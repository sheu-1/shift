<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Shift Roster{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Roster<span class="brand-accent">Line</span></span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint=='index' }}">Dashboard</a>
      <a href="{{ url_for('workers') }}" class="{{ 'active' if request.endpoint=='workers' }}">Workers</a>
      <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint=='settings' }}">Settings</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>RosterLine &middot; shift planning, sorted.</span>
  </footer>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
